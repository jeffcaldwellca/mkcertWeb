<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>login · mkcert Web UI</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="prompt">&gt;</span> mkcert<span class="sub">_web</span></div>
    <h1 class="page-title"><span class="prompt">$</span> login</h1>

    <div id="login-error" class="banner banner--err" role="alert" hidden></div>

    <form method="POST" action="/login">
      <div class="field">
        <label for="username">username</label>
        <input class="input" id="username" type="text" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">password</label>
        <input class="input" id="password" type="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary">sign in</button>
    </form>

    <div id="oidc-login-section" hidden>
      <div class="login-or">or</div>
      <a href="/auth/oidc" class="btn">sign in with sso</a>
    </div>

    <div class="login-foot">
      <a href="/">return home</a>
      <button type="button" class="btn btn--ghost" id="theme-toggle" aria-label="Toggle theme">theme</button>
    </div>
  </div>
</main>
<script src="js/core.js"></script>
<script src="js/login.js"></script>
</body>
</html>
